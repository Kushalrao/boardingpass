<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Boarding Pass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@500;600&family=Inter:wght@600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      background-color: #f1f5eb;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'MuseoModerno', sans-serif;
      font-weight: 600;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .header-row {
      display: flex;
      align-items: center;
      width: 390px;
      padding: 0 9px;
      margin-top: 0;
      flex-shrink: 0;
      height: 74px;
    }

    .header-logo {
      width: 224px;
      height: 74px;
      flex-shrink: 0;
    }

    /* --- Toggle switch (3-state) --- */
    .view-toggle {
      width: 152px;
      height: 42.86px;
      border-radius: 70.27px;
      background: white;
      box-shadow: 0px 4px 35px rgba(0,0,0,0.15);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: auto;
    }

    .toggle-thumb {
      position: absolute;
      width: 42px;
      height: 35.84px;
      border-radius: 28.11px;
      background: black;
      top: 3.51px;
      left: 3.51px;
      transition: left 0.25s ease;
    }

    .view-toggle.print-active .toggle-thumb {
      left: 55px;
    }

    .view-toggle.map-active .toggle-thumb {
      left: 106.5px;
    }

    .toggle-icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-icon-list { left: 11px; }
    .toggle-icon-print { left: 63px; }
    .toggle-icon-map { right: 11px; }

    .toggle-icon svg {
      width: 22px;
      height: 22px;
    }

    /* Active = white, inactive = black */
    .view-toggle .toggle-icon-list svg { fill: white; }
    .view-toggle .toggle-icon-print svg { fill: black; }
    .view-toggle .toggle-icon-map svg { fill: black; }
    .view-toggle.print-active .toggle-icon-list svg { fill: black; }
    .view-toggle.print-active .toggle-icon-print svg { fill: white; }
    .view-toggle.print-active .toggle-icon-map svg { fill: black; }
    .view-toggle.map-active .toggle-icon-list svg { fill: black; }
    .view-toggle.map-active .toggle-icon-print svg { fill: black; }
    .view-toggle.map-active .toggle-icon-map svg { fill: white; }

    /* --- Print card --- */
    .print-card {
      width: 372px;
      margin-top: 8px;
      border-radius: 27px;
      overflow: hidden;
      position: relative;
      flex: 1;
      margin-bottom: 0;
      background: transparent;
    }

    .print-surface {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(
        180deg,
        rgb(254, 6, 5) 0%,
        rgb(255, 140, 4) 8.8547%,
        rgb(254, 251, 0) 26.307%,
        rgb(90, 252, 1) 43.196%,
        rgb(42, 234, 213) 58.508%,
        rgb(1, 9, 255) 76.861%,
        rgb(140, 3, 255) 89.471%,
        rgb(250, 5, 222) 100%
      );
      border-radius: 27px;
      background-size: 100% 200%;
      background-position: 0 0;
      clip-path: polygon(0 0, 0 0, 0 0, 0 0);
    }

    .print-surface .flight-rows {
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      height: 100%;
      overflow: hidden;
    }

    .laser-rail {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(180deg,
        rgba(160,160,170,0.5) 0%,
        rgba(220,220,230,0.7) 40%,
        rgba(255,255,255,0.8) 50%,
        rgba(200,200,210,0.6) 100%
      );
      z-index: 8;
      pointer-events: none;
      opacity: 0;
      border-radius: 1.5px;
    }

    .laser-rail.active { opacity: 1; }

    .laser-arm {
      position: absolute;
      width: 16px;
      height: 22px;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent 75%, rgba(180,140,50,0.9) 90%, rgba(220,180,80,1) 100%),
        linear-gradient(90deg,
          #555 0%,
          #999 15%,
          #ccc 35%,
          #eee 48%,
          #fff 50%,
          #eee 52%,
          #ccc 65%,
          #999 85%,
          #555 100%
        );
      clip-path: polygon(22% 0%, 78% 0%, 58% 100%, 42% 100%);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
    }

    .laser-arm.active { opacity: 1; }

    .laser-head {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: white;
      z-index: 11;
      opacity: 0;
      pointer-events: none;
    }

    .laser-head.active { opacity: 1; }

    .laser-sparks {
      position: absolute;
      width: 0;
      height: 0;
      z-index: 11;
      pointer-events: none;
      opacity: 0;
    }

    .laser-sparks.active { opacity: 1; }

    .spark {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 2px rgba(255, 220, 80, 0.9);
      opacity: 0;
      animation: sparkFly 0.45s ease-out infinite;
    }

    @keyframes sparkFly {
      0% { transform: translate(0, 0) scale(1.2); opacity: 1; }
      60% { opacity: 0.6; }
      100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
    }

    .print-heat {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 27px;
      pointer-events: none;
      z-index: 3;
      opacity: 0;
    }

    .print-heat.active { opacity: 1; }

    .laser-surface-glow {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: screen;
    }

    .laser-surface-glow.active { opacity: 1; }

    .laser-trail {
      position: absolute;
      height: 3px;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
    }

    .laser-trail.active { opacity: 1; }

    .print-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 27px;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 255, 255, 0.7) 0%,
        rgba(255, 255, 255, 0.4) 25%,
        rgba(255, 255, 255, 0.15) 55%,
        transparent 100%
      );
      z-index: 20;
      pointer-events: none;
      opacity: 0;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      transition: opacity 0.3s ease-in, backdrop-filter 0.5s ease, -webkit-backdrop-filter 0.5s ease;
    }

    .print-flash.active {
      opacity: 1;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }


    /* --- Map card (variant) --- */
    .map-card {
      width: 372px;
      margin-top: 8px;
      border-radius: 27px;
      overflow: hidden;
      position: relative;
      flex: 1;
      margin-bottom: 0;
      background-color: #F0EDD2;
      background-position: 0 0;
    }


    .flight-card {
      width: 372px;
      margin-top: 8px;
      border-radius: 27px;
      overflow: hidden;
      position: relative;
      flex: 1;
      margin-bottom: 0;
      background-image: linear-gradient(
        180deg,
        rgb(254, 6, 5) 0%,
        rgb(255, 140, 4) 8.8547%,
        rgb(254, 251, 0) 26.307%,
        rgb(90, 252, 1) 43.196%,
        rgb(42, 234, 213) 58.508%,
        rgb(1, 9, 255) 76.861%,
        rgb(140, 3, 255) 89.471%,
        rgb(250, 5, 222) 100%
      );
      background-size: 100% 200%;
      background-position: 0 0;
      transition: background-position 0.3s ease-out, transform 0.15s ease-out;
      transform-style: preserve-3d;
      will-change: transform;
    }


    .share-btn {
      position: absolute;
      bottom: 13px;
      right: 13px;
      width: 32px;
      height: 32px;
      z-index: 2;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    .share-btn img {
      width: 100%;
      height: 100%;
    }

    .flight-rows {
      position: relative;
      z-index: 1;
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    .flight-row {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }

    .pill {
      background: white;
      border-radius: 13px;
      padding: 0 7px;
      font-size: 27.44px;
      color: black;
      white-space: nowrap;
      overflow: hidden;
      height: 44px;
      position: relative;
      transition: background-color 0.2s ease-out;
    }

    .pill.airline-brand { color: white; }

    /* Slot slider: 3 values stacked, middle one visible */
    .pill-slider {
      transform: translateY(-44px);
    }

    .pill-slider.animating {
      transition: transform 0.4s ease-out;
    }

    .pill-val {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Split-flap animation (for loading board) */
    .pill-flip {
      transition: transform 0.25s ease-in, opacity 0.25s ease-in;
    }

    .pill-flip.flipping {
      transform: scaleY(0);
      opacity: 0.3;
    }

    .status-msg {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: white;
      font-size: 18px;
      text-align: center;
      padding: 20px;
      flex-direction: column;
      gap: 16px;
    }

    .sign-in-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 24px;
    }

    .btn {
      font-family: 'MuseoModerno', sans-serif;
      font-weight: 600;
      font-size: 18px;
      padding: 14px 32px;
      border: none;
      border-radius: 13px;
      background: #0D47A1;
      color: white;
      cursor: pointer;
    }

    .btn:hover { background: #1565C0; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-small {
      font-size: 14px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.2);
    }

    .btn-small:hover { background: rgba(255,255,255,0.35); }

    .globe-label {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.15s ease-out;
    }

    .globe-label-pill {
      background: white;
      border-radius: 12.161px;
      padding: 0 6.548px;
      font-family: 'MuseoModerno', sans-serif;
      font-weight: 600;
      font-size: 25.67px;
      color: black;
      white-space: nowrap;
      line-height: 41px;
    }

    .globe-label-arrow {
      width: 0;
      height: 0;
      border-left: 9.5px solid transparent;
      border-right: 9.5px solid transparent;
      border-top: 13px solid white;
    }

    .share-pill-btn {
      background: black;
      color: white;
      border: none;
      border-radius: 70.27px;
      padding: 15px 27px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 20px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .hidden { display: none !important; }

    /* --- "My Boarding pass" pill button --- */
    .my-pass-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: white;
      border: none;
      border-radius: 70.27px;
      padding: 15px 27px;
      box-shadow: 0px 4px 45px 30px rgba(0,0,0,0.25);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 20px;
      color: black;
      white-space: nowrap;
    }

    /* --- Popup overlay --- */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.16);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-card {
      background: white;
      width: 353px;
      height: 634px;
      position: relative;
      overflow: hidden;
    }

    .popup-close {
      position: absolute;
      top: 23px;
      right: 21px;
      width: 39px;
      height: 39px;
      border: none;
      background: none;
      cursor: pointer;
      padding: 0;
    }

    .popup-close img {
      width: 100%;
      height: 100%;
    }

    .popup-title {
      position: absolute;
      left: 21px;
      top: 23px;
      width: 311px;
      font-family: 'MuseoModerno', sans-serif;
      font-weight: 600;
      font-size: 27.44px;
      line-height: 37px;
      color: black;
    }

    .popup-text {
      position: absolute;
      left: 21px;
      width: 311px;
      font-family: 'MuseoModerno', sans-serif;
      font-weight: 500;
      font-size: 17px;
      line-height: 27px;
      color: black;
    }

    .popup-text-1 {
      top: 175px;
    }

    .popup-text-2 {
      top: 304px;
    }

    .popup-signin-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 68px;
      background: black;
      color: white;
      border: none;
      border-radius: 70.27px;
      padding: 15px 27px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 20px;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Homepage (unauthenticated) -->
  <div id="sign-in-screen" style="display:flex; flex-direction:column; align-items:center; height:100%; width:100%;">
    <div class="header-row">
      <img src="assets/boarding_pass_logo.svg" class="header-logo" alt="boarding pass" />
      <div class="view-toggle" id="home-toggle" onclick="toggleHomeView()">
        <div class="toggle-thumb"></div>
        <div class="toggle-icon toggle-icon-list">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </div>
        <div class="toggle-icon toggle-icon-print">
          <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
        </div>
        <div class="toggle-icon toggle-icon-map">
          <svg viewBox="0 0 24 24"><path d="M9 2L3 5v17l6-3 6 3 6-3V2l-6 3-6-3zM9 5.5l6 3v10l-6-3v-10z"/></svg>
        </div>
      </div>
    </div>

    <div class="flight-card" id="home-list-card" style="margin-top:8px;">
      <img src="assets/pass_text.svg" style="position:absolute;right:13px;top:13px;height:42px;z-index:0;pointer-events:none;" alt="pass" />
      <div id="home-flight-rows" class="flight-rows"></div>
      <button class="my-pass-btn" onclick="showSignInPopup()">My Boarding pass</button>
    </div>

    <div class="map-card" id="home-map-card" style="display:none; margin-top:8px;">
      <img src="assets/map_text.svg" style="position:absolute;right:13px;top:6px;height:39px;z-index:2;pointer-events:none;" alt="map" />
      <canvas id="home-globe-canvas" style="width:100%;height:100%;position:absolute;top:0;left:0;"></canvas>
      <div id="home-globe-labels" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;"></div>
      <button class="my-pass-btn" onclick="showSignInPopup()">My Boarding pass</button>
    </div>
  </div>

  <!-- Sign-in popup -->
  <div id="signin-popup" class="popup-overlay hidden" onclick="if(event.target===this)hideSignInPopup()">
    <div class="popup-card">
      <p class="popup-title">How we make<br>your pass</p>
      <button class="popup-close" onclick="hideSignInPopup()">
        <img src="assets/close_icon.svg" alt="close" />
      </button>
      <p class="popup-text popup-text-1">Its a one time access request</p>
      <p class="popup-text popup-text-2">Data is used to create the pass and is never stored</p>
      <button class="popup-signin-btn" onclick="handleFullSignIn()">Sign in with Google</button>
    </div>
  </div>

  <!-- Main app screen -->
  <div id="app-screen" class="hidden" style="display:none; flex-direction: column; align-items: center; height: 100%; width: 100%;">
    <div style="display:flex; justify-content:center; padding:10px 0; flex-shrink:0;">
      <div class="view-toggle" id="view-toggle" onclick="toggleView()">
        <div class="toggle-thumb"></div>
        <div class="toggle-icon toggle-icon-list">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </div>
        <div class="toggle-icon toggle-icon-print">
          <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
        </div>
        <div class="toggle-icon toggle-icon-map">
          <svg viewBox="0 0 24 24"><path d="M9 2L3 5v17l6-3 6 3 6-3V2l-6 3-6-3zM9 5.5l6 3v10l-6-3v-10z"/></svg>
        </div>
      </div>
    </div>

    <div class="flight-card" id="flight-card">
      <img src="assets/pass_text.svg" style="position:absolute;right:13px;top:13px;height:42px;z-index:0;pointer-events:none;" alt="pass" />
      <div id="flight-rows" class="flight-rows">
        <div class="status-msg">Loading...</div>
      </div>
    </div>

    <div class="print-card" id="print-card" style="display:none">
      <div class="print-surface" id="print-surface">
        <img src="assets/pass_text.svg" style="position:absolute;right:13px;top:13px;height:42px;z-index:0;pointer-events:none;" alt="pass" />
        <div class="flight-rows" id="print-flight-rows"></div>
      </div>
      <div class="print-heat" id="print-heat"></div>
      <div class="laser-surface-glow" id="laser-surface-glow"></div>
      <div class="laser-rail" id="laser-rail"></div>
      <div class="laser-arm" id="laser-arm"></div>
      <div class="laser-trail" id="laser-trail"></div>
      <div class="laser-head" id="laser-head"></div>
      <div class="laser-sparks" id="laser-sparks">
        <div class="spark" style="--sx:18px;--sy:-12px;animation-delay:0s"></div>
        <div class="spark" style="--sx:-16px;--sy:-8px;animation-delay:0.06s"></div>
        <div class="spark" style="--sx:12px;--sy:14px;animation-delay:0.12s"></div>
        <div class="spark" style="--sx:-10px;--sy:16px;animation-delay:0.18s"></div>
        <div class="spark" style="--sx:20px;--sy:4px;animation-delay:0.24s"></div>
        <div class="spark" style="--sx:-18px;--sy:6px;animation-delay:0.3s"></div>
        <div class="spark" style="--sx:6px;--sy:-18px;animation-delay:0.36s"></div>
        <div class="spark" style="--sx:-8px;--sy:-16px;animation-delay:0.08s"></div>
        <div class="spark" style="--sx:14px;--sy:10px;animation-delay:0.2s"></div>
        <div class="spark" style="--sx:-14px;--sy:12px;animation-delay:0.15s"></div>
      </div>
      <div class="print-flash" id="print-flash"></div>
    </div>

    <div class="map-card" id="map-card" style="display:none">
      <span id="traveled-text" style="position:absolute;left:14px;top:6px;font-family:'MuseoModerno',sans-serif;font-weight:600;font-size:25.67px;color:black;z-index:2;white-space:nowrap;"></span>
      <img src="assets/map_text.svg" style="position:absolute;right:13px;top:6px;height:39px;z-index:2;pointer-events:none;" alt="map" />
      <canvas id="globe-canvas" style="width:100%;height:100%;position:absolute;top:0;left:0;"></canvas>
      <div id="globe-labels" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;"></div>
    </div>

    <button class="share-pill-btn" onclick="shareCard()">Share</button>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>


  <!-- html2canvas for share-as-image -->

  <script>
    // ============================================
    // Logger — console.log only
    // ============================================
    function log(tag, msg, data) {
      const ts = new Date().toISOString().substring(11, 23);
      const entry = '[' + ts + '] [' + tag + '] ' + msg;
      if (data !== undefined) {
        console.log(entry, data);
      } else {
        console.log(entry);
      }
    }

    // ============================================
    // Haptics (iOS checkbox-switch trick + Android vibrate)
    // ============================================
    let _hapticLabel = null;
    (function initHaptics() {
      if (typeof document === 'undefined') return;
      const label = document.createElement('label');
      label.style.position = 'fixed';
      label.style.left = '-9999px';
      label.style.top = '-9999px';
      label.style.opacity = '0';
      label.style.pointerEvents = 'none';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.setAttribute('switch', '');
      label.appendChild(input);
      document.body.appendChild(label);
      _hapticLabel = label;
    })();

    function triggerHaptic() {
      // iOS: toggling a switch checkbox triggers native haptic
      if (_hapticLabel) _hapticLabel.click();
      // Android: vibrate API
      if (navigator.vibrate) navigator.vibrate(10);
    }

    firebase.initializeApp({

    // ============================================

      '6E': '#2B2D6E', // IndiGo navy
      'SG': '#DC1A22', // SpiceJet red
      'I5': '#FF0000', // AirAsia red
      'LH': '#05164D', // Lufthansa dark blue
      'EK': '#D71921', // Emirates red

    // ============================================
    // Domain → Airline Code
    // ============================================
    const DOMAIN_TO_CODE = {
      'goindigo.in': '6E', 'airindia.com': 'AI', 'airindia.in': 'AI',
      'spicejet.com': 'SG', 'airvistara.com': 'UK', 'airasia.com': 'I5',
      'akasaair.com': 'QP', 'allianceair.in': '9I', 'starair.in': 'S5',
      'flybigair.com': 'S9', 'emirates.com': 'EK', 'qatarairways.com': 'QR',
      'etihad.com': 'EY', 'flydubai.com': 'FZ', 'omanair.com': 'WY',
      'saudia.com': 'SV', 'gulfair.com': 'GF', 'singaporeair.com': 'SQ',
      'malaysiaairlines.com': 'MH', 'thaiairways.com': 'TG',
      'cathaypacific.com': 'CX', 'srilankan.com': 'UL', 'lufthansa.com': 'LH',
      'britishairways.com': 'BA', 'email.ba.com': 'BA', 'klm.com': 'KL',
      'airfrance.com': 'AF', 'turkishairlines.com': 'TK', 'thy.com': 'TK',
      'ryanair.com': 'FR', 'easyjet.com': 'U2', 'united.com': 'UA',
      'delta.com': 'DL', 'aa.com': 'AA', 'americanairlines.com': 'AA',
      'southwest.com': 'WN', 'jetblue.com': 'B6', 'aircanada.com': 'AC',
      'jal.com': 'JL', 'koreanair.com': 'KE', 'qantas.com': 'QF',
      'ana.co.jp': 'NH', 'evaair.com': 'BR', 'ethiopianairlines.com': 'ET',
      'egyptair.com': 'MS', 'airnewzealand.com': 'NZ',
    };

    const MONTH_MAP = {
      'jan': '01', 'feb': '02', 'mar': '03', 'apr': '04',
      'may': '05', 'jun': '06', 'jul': '07', 'aug': '08',
      'sep': '09', 'oct': '10', 'nov': '11', 'dec': '12',
    };

    // ============================================
    // Extraction helpers (ported from flightGrouper.ts)
    // ============================================
    const FLIGHT_NUM_RE = /\b(AI|6E|SG|UK|I5|G8|QP|EK|QR|SQ|BA|LH|TK|EY|FZ|WY|GF|AA|UA|DL|WN|B6|AC|JL|KE|QF|AF|KL|CX|UL|MH|TG|FR|U2|NH|BR|ET|MS|NZ|9W)\s*[-]?\s*(\d{2,4})\b/;
    const ROUTE_RE = /\b([A-Z]{3})\s*(?:[-\u2192\u2794>]+|to)\s*([A-Z]{3})\b/;
    const DATE_RE_1 = /\b(\d{1,2})\s*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s*[',]?\s*(\d{2,4})\b/i;
    const DATE_RE_2 = /\b(\d{1,2})(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)(\d{2,4})\b/i;
    // "15 NOV '22" or "05 DEC '22" — apostrophe before 2-digit year
    const DATE_RE_3 = /\b(\d{1,2})\s*(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s*'(\d{2})\b/i;
    // "13-Nov-2022" or "13/Nov/2022" — dash/slash separator
    const DATE_RE_4 = /\b(\d{1,2})[-\/](Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[-\/](\d{2,4})\b/i;
    const TIME_RE = /\b(\d{1,2}):(\d{2})\b/;

    function extractAirlineCode(senderDomain, text) {
      if (senderDomain) {
        if (DOMAIN_TO_CODE[senderDomain]) return DOMAIN_TO_CODE[senderDomain];
        const parts = senderDomain.split('.');
        for (let i = 1; i < parts.length - 1; i++) {
          const parent = parts.slice(i).join('.');
          if (DOMAIN_TO_CODE[parent]) return DOMAIN_TO_CODE[parent];
        }
      }
      const m = text.match(FLIGHT_NUM_RE);
      return m ? m[1] : null;
    }

    // Common Indian city → IATA code mapping for OTA emails that use city names
    const CITY_TO_IATA = {
      'new delhi': 'DEL', 'delhi': 'DEL', 'bengaluru': 'BLR', 'bangalore': 'BLR',
      'mumbai': 'BOM', 'bombay': 'BOM', 'chennai': 'MAA', 'madras': 'MAA',
      'kolkata': 'CCU', 'calcutta': 'CCU', 'hyderabad': 'HYD', 'pune': 'PNQ',
      'ahmedabad': 'AMD', 'jaipur': 'JAI', 'lucknow': 'LKO', 'goa': 'GOI',
      'kochi': 'COK', 'cochin': 'COK', 'thiruvananthapuram': 'TRV',
      'trivandrum': 'TRV', 'guwahati': 'GAU', 'patna': 'PAT',
      'chandigarh': 'IXC', 'indore': 'IDR', 'bhopal': 'BHO',
      'varanasi': 'VNS', 'srinagar': 'SXR', 'amritsar': 'ATQ',
      'coimbatore': 'CJB', 'nagpur': 'NAG', 'visakhapatnam': 'VTZ',
      'vizag': 'VTZ', 'mangalore': 'IXE', 'ranchi': 'IXR',
      'bhubaneswar': 'BBI', 'dehradun': 'DED', 'udaipur': 'UDR',
      'leh': 'IXL', 'bagdogra': 'IXB', 'imphal': 'IMF',
      'dubai': 'DXB', 'singapore': 'SIN', 'london': 'LHR',
      'new york': 'JFK', 'bangkok': 'BKK', 'hong kong': 'HKG',
      'kuala lumpur': 'KUL', 'tokyo': 'NRT', 'paris': 'CDG',
      'san francisco': 'SFO', 'los angeles': 'LAX', 'sydney': 'SYD',
      'doha': 'DOH', 'abu dhabi': 'AUH', 'kathmandu': 'KTM',
      'colombo': 'CMB', 'dhaka': 'DAC', 'toronto': 'YYZ',
    };

    function extractAirports(text) {
      // Try IATA code route pattern first (DEL -> BOM)
      const m = text.match(ROUTE_RE);
      if (m) return { origin: m[1], destination: m[2] };

      // Try "FROM XXX" and "TO XXX" patterns
      const fromMatch = text.match(/\bfrom\s+([A-Z]{3})\b/i);
      const toMatch = text.match(/\bto\s+([A-Z]{3})\b/);
      if (fromMatch && toMatch) return { origin: fromMatch[1].toUpperCase(), destination: toMatch[1] };
      if (toMatch) return { origin: null, destination: toMatch[1] };

      // Try city name patterns
      const cityPatterns = [
        /\b([\w\s]+?)\s*(?:to|-|–)\s*([\w\s]+?)(?:\s+flight|\s+one-way|\s+round|\s*$)/i,
      ];
      for (const pat of cityPatterns) {
        const cm = text.match(pat);
        if (cm) {
          const originCity = cm[1].trim().toLowerCase();
          const destCity = cm[2].trim().toLowerCase();
          const o = CITY_TO_IATA[originCity] || null;
          const d = CITY_TO_IATA[destCity] || null;
          if (d) return { origin: o, destination: d };
        }
      }

      // Last resort: find IATA codes in text
      const allIata = [...text.matchAll(/\b(DEL|BOM|BLR|MAA|CCU|HYD|PNQ|AMD|JAI|LKO|GOI|COK|GAU|SXR|ATQ|DXB|SIN|LHR|JFK|BKK|HKG|KUL|CDG|SFO|LAX|SYD|IXC|IDR|VNS|NAG|BBI|IXE)\b/g)];
      if (allIata.length >= 2) return { origin: allIata[0][1], destination: allIata[1][1] };
      if (allIata.length === 1) return { origin: null, destination: allIata[0][1] };

      return { origin: null, destination: null };
    }

    // Backward-compatible wrapper
    function extractAirport(text) {
      return extractAirports(text).destination;
    }

    function extractDate(text) {
      for (const re of [DATE_RE_1, DATE_RE_2, DATE_RE_3, DATE_RE_4]) {
        const m = text.match(re);
        if (m) {
          const day = m[1];
          const month = MONTH_MAP[m[2].toLowerCase().substring(0, 3)];
          let year = m[3];
          if (!month) continue;
          if (year.length === 2) year = parseInt(year) > 50 ? '19' + year : '20' + year;
          return { day: parseInt(day), month: parseInt(month), year: parseInt(year) };
        }
      }
      return null;
    }

    function extractTime(text) {
      const lower = text.toLowerCase();

      // Look for time near flight-related keywords
      const keywords = ['departure', 'depart', 'boarding', 'dep time', 'dep.', 'scheduled', 'takes off', 'flight time'];
      for (const kw of keywords) {
        const idx = lower.indexOf(kw);
        if (idx >= 0) {
          const chunk = text.substring(idx, Math.min(idx + 100, text.length));
          const m = chunk.match(TIME_RE);
          if (m) return m[1].padStart(2, '0') + ':' + m[2];
        }
      }

      // Look for time right after an IATA code (e.g., "BLR 11:30" or "DEL 21:45")
      const iataTimeMatch = text.match(/\b[A-Z]{3}\s+(\d{1,2}):(\d{2})\b/);
      if (iataTimeMatch) return iataTimeMatch[1].padStart(2, '0') + ':' + iataTimeMatch[2];

      // Look for time in "HH:MM AM/PM" format
      const ampmMatch = text.match(/\b(\d{1,2}):(\d{2})\s*(AM|PM)\b/i);
      if (ampmMatch) {
        let h = parseInt(ampmMatch[1]);
        if (ampmMatch[3].toUpperCase() === 'PM' && h < 12) h += 12;
        if (ampmMatch[3].toUpperCase() === 'AM' && h === 12) h = 0;
        return String(h).padStart(2, '0') + ':' + ampmMatch[2];
      }

      // Fallback: first time pattern
      const m = text.match(TIME_RE);
      return m ? m[1].padStart(2, '0') + ':' + m[2] : null;
    }

    // ============================================
    // Split-flap loading board (airport departure board style)
    // ============================================

    const RANDOM_AIRPORTS = ['DEL','BOM','BLR','MAA','CCU','HYD','SIN','DXB','LHR','JFK','SFO','CDG','HKG','NRT','BKK','SYD','LAX','DOH','AMS','FRA','ICN','KUL','ATQ','GOI','PNQ','AMD','JAI','LKO','SXR','COK'];
    const RANDOM_AIRLINES = Object.keys(AIRLINE_BRAND_COLORS);
    let _flipInterval = null;
    let _flipRows = [];

    function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function randDay() { return String(Math.floor(Math.random() * 28) + 1).padStart(2, '0'); }
    function randTime() { return String(Math.floor(Math.random() * 24)).padStart(2, '0') + ':' + String(Math.floor(Math.random() * 6) * 10).padStart(2, '0'); }

    function startFlipBoard() {
      stopFlipBoard();
      const container = document.getElementById('flight-rows');
      container.innerHTML = '';
      _flipRows = [];

      // Create 12 rows of random data
      for (let i = 0; i < 12; i++) {
        const row = document.createElement('div');
        row.className = 'flight-row';

        const airline = randItem(RANDOM_AIRLINES);
        const pills = [
          { el: makePillFlip(randDay(), null), type: 'day' },
          { el: makePillFlip(randItem(RANDOM_AIRPORTS), null), type: 'airport' },
          { el: makePillFlip(airline, AIRLINE_BRAND_COLORS[airline]), type: 'airline' },
          { el: makePillFlip(randTime(), null), type: 'time' },
        ];

        pills.forEach(p => row.appendChild(p.el));
        container.appendChild(row);
        _flipRows.push(pills);
      }

      // Every 400ms, flip 2-3 random pills
      _flipInterval = setInterval(() => {
        const count = 2 + Math.floor(Math.random() * 2);
        for (let c = 0; c < count; c++) {
          const ri = Math.floor(Math.random() * _flipRows.length);
          const pi = Math.floor(Math.random() * 4);
          const pill = _flipRows[ri][pi];

          // Flip down
          pill.el.classList.add('flipping');

          setTimeout(() => {
            // Change value while hidden
            if (pill.type === 'day') {
              pill.el.textContent = randDay();
            } else if (pill.type === 'airport') {
              pill.el.textContent = randItem(RANDOM_AIRPORTS);
            } else if (pill.type === 'airline') {
              const newAirline = randItem(RANDOM_AIRLINES);
              pill.el.textContent = newAirline;
              const color = AIRLINE_BRAND_COLORS[newAirline];
              if (color) {
                pill.el.style.backgroundColor = color;
                pill.el.className = 'pill pill-flip airline-brand';
              } else {
                pill.el.style.backgroundColor = '';
                pill.el.className = 'pill pill-flip';
              }
            } else {
              pill.el.textContent = randTime();
            }

            // Flip back up
            pill.el.classList.remove('flipping');
          }, 250);
        }
      }, 400);
    }

    function stopFlipBoard() {
      if (_flipInterval) {
        clearInterval(_flipInterval);
        _flipInterval = null;
      }
      _flipRows = [];
    }

    function makePillFlip(text, brandColor) {
      const el = document.createElement('div');
      el.className = 'pill pill-flip' + (brandColor ? ' airline-brand' : '');
      if (brandColor) el.style.backgroundColor = brandColor;
      el.textContent = text;
      return el;
    }

    // ============================================
    // UI helpers
    // ============================================

    function showStatus(msg) {
      stopFlipBoard();
      document.getElementById('flight-rows').innerHTML =
        '<div class="status-msg">' + msg + '</div>';
    }

    function createPill(text, brandColor) {
      const el = document.createElement('div');
      el.className = 'pill' + (brandColor ? ' airline-brand' : '');
      if (brandColor) el.style.backgroundColor = brandColor;
      el.textContent = text;
      return el;
    }

    // ============================================
    // Share card as image
    // ============================================

    async function shareCard() {
      const card = _currentView === 'map'
        ? document.getElementById('map-card')
        : document.getElementById('flight-card');
      if (!card) return;
      const shareBtn = null; // share button is now outside the card

      try {
        log('SHARE', 'Capturing card as image');

        // No share button inside the card to hide

        // Remove 3D transform temporarily for clean capture
        const prevTransform = card.style.transform;
        card.style.transform = 'none';

        const canvas = await html2canvas(card, {
          backgroundColor: null,
          scale: window.devicePixelRatio * 3,
          useCORS: true,
          logging: false,
          imageTimeout: 0,
          removeContainer: true,
        });

        // Restore
        card.style.transform = prevTransform;

        log('SHARE', 'Canvas created: ' + canvas.width + 'x' + canvas.height);

        // Convert to blob
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], 'boarding-pass.png', { type: 'image/png' });

        // Use Web Share API if available (mobile)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          log('SHARE', 'Using Web Share API');
          await navigator.share({
            title: 'My Boarding Pass',
            files: [file],
          });
          log('SHARE', 'Shared successfully');
        } else {
          // Fallback: download the image
          log('SHARE', 'Web Share not available — downloading');
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'boarding-pass.png';
          a.click();
          URL.revokeObjectURL(url);
        }
      } catch (e) {
        log('SHARE', 'Error: ' + e.message);
        // Error handled
      }
    }

    // ============================================
    // Slot renderer — fixed containers, content slides through
    // ============================================

    let _slotRows = [];       // [{day, airport, airline, time}] - each has {pill, slider, vals[3]}
    let _slotIndex = 0;
    let _slotVisible = 12;
    let _slotAnimating = false;
    let _slotTouchStartY = 0;

    function renderFlights(flights) {
      _currentFlights = flights;
      _slotIndex = 0;
      stopFlipBoard();
      const container = document.getElementById('flight-rows');
      container.innerHTML = '';
      _slotRows = [];

      if (flights.length === 0) {
        container.innerHTML =
          '<div class="status-msg">No flights detected yet</div>';
        return;
      }

      // Calculate how many rows fit: each row = 44px + 9px gap
      const ROW_H = 44;
      const GAP = 9;
      const availableH = container.clientHeight || 580;
      _slotVisible = Math.max(1, Math.floor((availableH + GAP) / (ROW_H + GAP)));
      _slotVisible = Math.min(_slotVisible, flights.length);
      log('SLOT', 'Visible rows: ' + _slotVisible + ' (available: ' + availableH + 'px)');

      // Create fixed rows with 3-slot sliders inside each pill
      for (let i = 0; i < _slotVisible; i++) {
        const row = document.createElement('div');
        row.className = 'flight-row';

        const cols = ['day', 'airport', 'airline', 'time'];
        const rowData = {};

        for (const col of cols) {
          const pill = document.createElement('div');
          pill.className = 'pill';

          const slider = document.createElement('div');
          slider.className = 'pill-slider';

          const vals = [];
          for (let v = 0; v < 3; v++) {
            const val = document.createElement('div');
            val.className = 'pill-val';
            slider.appendChild(val);
            vals.push(val);
          }

          pill.appendChild(slider);
          row.appendChild(pill);
          rowData[col] = { pill, slider, vals };
        }

        container.appendChild(row);
        _slotRows.push(rowData);
      }

      // Fill initial content (middle slot = index 1)
      slotFillAll();
      slotApplyOpacity();

      // Attach scroll handlers
      container.addEventListener('wheel', slotOnWheel, { passive: false });
      container.addEventListener('touchstart', slotOnTouchStart, { passive: true });
      container.addEventListener('touchmove', slotOnTouchMove, { passive: false });
      container.addEventListener('touchend', slotOnTouchEnd, { passive: true });

      slotUpdateGradient();
    }

    function slotGetFlight(index) {
      if (index < 0 || index >= _currentFlights.length) return null;
      return _currentFlights[index];
    }

    function slotSetVal(rowData, col, slotIdx, flight) {
      const val = rowData[col].vals[slotIdx];
      if (col === 'day') val.textContent = flight ? flight.day : '';
      else if (col === 'airport') val.textContent = flight ? flight.airport : '';
      else if (col === 'airline') {
        val.textContent = flight ? flight.airline : '';
      }
      else if (col === 'time') val.textContent = flight ? flight.time : '';
    }

    function slotSetAirlineColor(rowData, flight) {
      const pill = rowData.airline.pill;
      if (flight) {
        const color = AIRLINE_BRAND_COLORS[flight.airline];
        if (color) {
          pill.style.backgroundColor = color;
          pill.classList.add('airline-brand');
        } else {
          pill.style.backgroundColor = '';
          pill.classList.remove('airline-brand');
        }
      } else {
        pill.style.backgroundColor = '';
        pill.classList.remove('airline-brand');
      }
    }

    function slotFillAll() {
      const cols = ['day', 'airport', 'airline', 'time'];
      for (let i = 0; i < _slotRows.length; i++) {
        const rd = _slotRows[i];
        const prev = slotGetFlight(_slotIndex + i - 1);
        const curr = slotGetFlight(_slotIndex + i);
        const next = slotGetFlight(_slotIndex + i + 1);

        for (const col of cols) {
          slotSetVal(rd, col, 0, prev);  // top (hidden above)
          slotSetVal(rd, col, 1, curr);  // middle (visible)
          slotSetVal(rd, col, 2, next);  // bottom (hidden below)
          rd[col].slider.classList.remove('animating');
          rd[col].slider.style.transform = 'translateY(-44px)';
        }
        slotSetAirlineColor(rd, curr);
      }
    }

    function slotShift(direction) {
      // direction: 1 = down (show next), -1 = up (show previous)
      if (_slotAnimating) return;
      const maxIndex = Math.max(0, _currentFlights.length - _slotVisible);
      const newIndex = _slotIndex + direction;
      if (newIndex < 0 || newIndex > maxIndex) return;

      _slotAnimating = true;
      triggerHaptic();
      const cols = ['day', 'airport', 'airline', 'time'];

      // Pre-fill the entering slot for each pill
      for (let i = 0; i < _slotRows.length; i++) {
        const rd = _slotRows[i];
        if (direction === 1) {
          // Scrolling down: new content enters from below (slot 2)
          const nextFlight = slotGetFlight(newIndex + i + 1);
          for (const col of cols) slotSetVal(rd, col, 2, nextFlight);
        } else {
          // Scrolling up: new content enters from above (slot 0)
          const prevFlight = slotGetFlight(newIndex + i - 1);
          for (const col of cols) slotSetVal(rd, col, 0, prevFlight);
        }

        // Update airline color to the NEW current flight
        const newCurr = slotGetFlight(newIndex + i);
        slotSetAirlineColor(rd, newCurr);
      }

      // Animate all sliders
      const targetY = direction === 1 ? -88 : 0;
      for (let i = 0; i < _slotRows.length; i++) {
        const rd = _slotRows[i];
        for (const col of cols) {
          rd[col].slider.classList.add('animating');
          rd[col].slider.style.transform = 'translateY(' + targetY + 'px)';
        }
      }

      // After animation: update index, reset positions
      setTimeout(() => {
        _slotIndex = newIndex;
        slotFillAll();
        _slotAnimating = false;
      }, 420);

      slotUpdateGradient();
    }

    function slotApplyOpacity() {
      const rows = document.getElementById('flight-rows');
      if (!rows) return;
      const children = rows.querySelectorAll('.flight-row');
      const n = children.length;
      for (let i = 0; i < n; i++) {
        if (i === 0 || i === n - 1) children[i].style.opacity = '0.6';
        else if (i === 1 || i === n - 2) children[i].style.opacity = '0.8';
        else children[i].style.opacity = '1';
      }
    }

    function slotUpdateGradient() {
      const card = document.getElementById('flight-card');
      if (!card || _currentFlights.length <= _slotVisible) return;
      const maxIndex = _currentFlights.length - _slotVisible;
      const pct = maxIndex > 0 ? (_slotIndex / maxIndex) * 100 : 0;
      card.style.backgroundPosition = '0 ' + pct + '%';
    }

    function slotOnWheel(e) {
      e.preventDefault();
      if (e.deltaY > 0) slotShift(1);
      else if (e.deltaY < 0) slotShift(-1);
    }

    function slotOnTouchStart(e) {
      _slotTouchStartY = e.touches[0].clientY;
    }

    function slotOnTouchMove(e) {
      e.preventDefault();
      const currentY = e.touches[0].clientY;
      const delta = _slotTouchStartY - currentY;
      if (delta > 30) {
        slotShift(1);
        _slotTouchStartY = currentY;
      } else if (delta < -30) {
        slotShift(-1);
        _slotTouchStartY = currentY;
      }
    }

    function slotOnTouchEnd() {}

    // ============================================
    // Load flights from Firestore
    // ============================================

    async function loadFlights(userId) {
      log('LOAD', 'Loading flights for uid=' + userId);
      const snapshot = await db
        .collection('users').doc(userId)
        .collection('detectedFlightEmails')
        .orderBy('detectedAt', 'desc')
        .get();

      log('LOAD', 'Firestore returned ' + snapshot.size + ' docs');

      const flights = [];
      snapshot.forEach((doc) => {
        const data = doc.data();
        const subject = data.subject || '';
        const body = data.body || '';
        const senderDomain = data.senderDomain || '';
        const text = subject + '\n' + body;

        const airlineCode = extractAirlineCode(senderDomain, text);
        const airports = extractAirports(text);
        const dateInfo = extractDate(text);
        const time = extractTime(text);

        if (airlineCode && airports.destination) {
          flights.push({
            day: dateInfo ? String(dateInfo.day).padStart(2, '0') : '--',
            airport: airports.destination,
            origin: airports.origin,
            airline: airlineCode,
            time: time || '--:--',
          });
        } else {
          log('LOAD', 'Skipped doc (missing data): airline=' + airlineCode + ' airport=' + airports.destination + ' subj="' + subject.substring(0, 60) + '"');
        }
      });

      log('LOAD', 'Parsed ' + flights.length + ' displayable flights from ' + snapshot.size + ' docs');
      return flights;
    }

    async function handleFullSignIn() {
      log('AUTH', 'Full sign-in flow started');
      _handledBySignIn = true;

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('email');
        provider.addScope('profile');
        provider.addScope('https://www.googleapis.com/auth/gmail.readonly');
        log('AUTH', 'Opening signInWithPopup...');
        const result = await auth.signInWithPopup(provider);
        const accessToken = result.credential.accessToken;
        log('AUTH', 'signInWithPopup succeeded — uid=' + result.user.uid + ' token=' + (accessToken || '').length);

        hideSignInPopup();

        // Switch to app screen with printer loading
        stopFlipBoard();
        document.getElementById('sign-in-screen').style.display = 'none';
        const appScreen = document.getElementById('app-screen');
        appScreen.style.display = 'flex';

        document.getElementById('map-card').style.display = 'none';

        // Start printer + scan
        startPrintAnimation();

      } catch (e) {

        _handledBySignIn = false;
      }
    }

    async function runScanWithToken(accessToken) {
      log('SCAN', 'Starting scan with access token');
      let prevFlightCount = 0;

      try {
        let batch = 1;
        let moreBatches = true;

        while (moreBatches) {
          log('SCAN', 'Calling scanFlightEmails batch=' + batch);
          const scanFn = functions.httpsCallable('scanFlightEmails', { timeout: 120000 });
          const result = await scanFn({ batch: batch, batchSize: 20, accessToken: accessToken });
          log('SCAN', 'Batch ' + batch + ' result:', result.data);
          moreBatches = result.data.moreBatches || false;
          batch++;

          // After each batch, load new flights and feed them to the printer
          const user = auth.currentUser;
          if (user && result.data.detectedInBatch > 0) {
            const allFlights = await loadFlights(user.uid);
            // New flights are at the start (ordered by detectedAt desc)
            const newCount = allFlights.length - prevFlightCount;
            if (newCount > 0) {
              const newFlights = allFlights.slice(0, newCount);
              log('SCAN', 'New flights this batch: ' + newFlights.length);
              for (const f of newFlights) {
                printQueueFlight(f);
              }
              prevFlightCount = allFlights.length;
            }
          }
        }

        log('SCAN', 'Scan complete. Total flights: ' + prevFlightCount);
        printScanComplete();

      } catch (e) {
        log('SCAN', 'FAILED: ' + e.message + ' | code=' + (e.code || 'none'));
        printScanComplete();
        showStatus('Scan failed: ' + (e.message || e));
      }
    }

    // Interpolate gradient color at Y position (accounts for background-size: 200%)
    const _gradStops = [
      { pos: 0,      r: 254, g: 6,   b: 5   },
      { pos: 0.0885, r: 255, g: 140, b: 4   },
      { pos: 0.2631, r: 254, g: 251, b: 0   },
      { pos: 0.4320, r: 90,  g: 252, b: 1   },
      { pos: 0.5851, r: 42,  g: 234, b: 213 },
      { pos: 0.7686, r: 1,   g: 9,   b: 255 },
      { pos: 0.8947, r: 140, g: 3,   b: 255 },
      { pos: 1.0,    r: 250, g: 5,   b: 222 },
    ];

    function getLaserGlow(y, h) {
      // Map Y to gradient position (200% stretch means visible range is 0 to 0.5)
      const t = (y / h) * 0.5;
      let low = _gradStops[0], high = _gradStops[1];
      for (let i = 1; i < _gradStops.length; i++) {
        if (t <= _gradStops[i].pos) { low = _gradStops[i - 1]; high = _gradStops[i]; break; }
      }
      const range = high.pos - low.pos;
      const frac = range > 0 ? (t - low.pos) / range : 0;
      const r = Math.round(low.r + (high.r - low.r) * frac);
      const g = Math.round(low.g + (high.g - low.g) * frac);
      const b = Math.round(low.b + (high.b - low.b) * frac);
      return 'rgba(' + r + ',' + g + ',' + b + ',';
    }

    function easeInOut(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function startPrintAnimation() {
      const surface = document.getElementById('print-surface');
      const head = document.getElementById('laser-head');
      const arm = document.getElementById('laser-arm');
      const trail = document.getElementById('laser-trail');
      const rail = document.getElementById('laser-rail');
      const sparks = document.getElementById('laser-sparks');
      const surfaceGlow = document.getElementById('laser-surface-glow');
      const heatOverlay = document.getElementById('print-heat');
      const card = document.getElementById('print-card');
      _printRowsContainer = document.getElementById('print-flight-rows');
      if (!surface || !head || !arm || !trail || !rail || !sparks || !card || !_printRowsContainer) return;

      const W = card.clientWidth || 372;
      const H = card.clientHeight || 631;
      const ROW_H = 53; // 44px pill + 9px gap
      const PAD = 13;
      const SWEEP_FRAMES = 45;

      _printQueue = [];
      _printScanDone = false;
      _printRowCount = 0;
      _printRowsContainer.innerHTML = '';

      let currentY = 0;
      let targetY = 0;
      let laserX = 0;
      let direction = 1;
      let sweepT = 0;
      let curLineH = 8;
      let curSweepFrames = 25;
      let finished = false;

      // Reset surface
      surface.style.clipPath = 'polygon(0 0, 0 0, 0 0, 0 0)';
      head.classList.add('active');
      arm.classList.add('active');
      trail.classList.add('active');
      rail.classList.add('active');
      sparks.classList.add('active');
      surfaceGlow.classList.add('active');
      heatOverlay.classList.add('active');

      function addFlightRow(flight) {
        const row = document.createElement('div');
        row.className = 'flight-row';
        const cols = [
          { text: flight.day, color: null },
          { text: flight.airport, color: null },
          { text: flight.airline, color: AIRLINE_BRAND_COLORS[flight.airline] || null },
          { text: flight.time, color: null },
        ];
        for (const col of cols) {
          const pill = document.createElement('div');
          pill.className = 'pill' + (col.color ? ' airline-brand' : '');
          if (col.color) pill.style.backgroundColor = col.color;
          pill.textContent = col.text;
          row.appendChild(pill);
        }
        _printRowsContainer.appendChild(row);
        _printRowCount++;

        // Set target Y — capped at card height (only print visible area)
        targetY = Math.min(PAD + _printRowCount * ROW_H, H);
      }

      function updateClip() {
        const btm = currentY + curLineH;
        if (direction === 1) {
          surface.style.clipPath =
            'polygon(0 0, ' + W + 'px 0, ' + W + 'px ' + currentY + 'px, ' +
            laserX + 'px ' + currentY + 'px, ' +
            laserX + 'px ' + btm + 'px, 0 ' + btm + 'px)';
        } else {
          surface.style.clipPath =
            'polygon(0 0, ' + W + 'px 0, ' +
            W + 'px ' + btm + 'px, ' +
            laserX + 'px ' + btm + 'px, ' +
            laserX + 'px ' + currentY + 'px, 0 ' + currentY + 'px)';
        }
      }

      function updateGlow() {
        const c = getLaserGlow(currentY, H);
        head.style.boxShadow =
          '0 0 2px 1px white, ' +
          '0 0 4px 2px rgba(255,255,255,1), ' +
          '0 0 8px 3px rgba(255,240,180,0.95), ' +
          '0 0 14px 6px rgba(255,200,50,0.7), ' +
          '0 0 22px 10px ' + c + '0.6), ' +
          '0 0 40px 18px ' + c + '0.35), ' +
          '0 0 65px 28px ' + c + '0.15)';
      }

      function tick() {
        if (finished) return;

        // Check queue for new flights
        while (_printQueue.length > 0) {
          addFlightRow(_printQueue.shift());
        }

        // Dynamic speed: more pending rows = faster printing
        const pendingRows = Math.max(0, Math.ceil((targetY - currentY) / ROW_H));
        if (pendingRows <= 2)       { curLineH = 8;  curSweepFrames = 25; }
        else if (pendingRows <= 5)  { curLineH = 11; curSweepFrames = 18; }
        else if (pendingRows <= 15) { curLineH = 14; curSweepFrames = 12; }
        else                        { curLineH = 20; curSweepFrames = 8;  }

        sweepT += 1 / curSweepFrames;

        if (sweepT >= 1) {
          laserX = direction === 1 ? W : 0;
          updateClip();

          // Advance Y if there's ground to cover
          if (currentY < targetY) {
            currentY += Math.min(curLineH, targetY - currentY);
            direction *= -1;
            sweepT = 0;
            updateGlow();
          } else if (_printScanDone && _printQueue.length === 0) {
            // Scan done and no more flights — finish
            surface.style.clipPath = 'polygon(0 0, 100% 0, 100% 100%, 0 100%)';
            head.classList.remove('active');
            arm.classList.remove('active');
            trail.classList.remove('active');
            rail.classList.remove('active');
            sparks.classList.remove('active');
            surfaceGlow.classList.remove('active');
            // Fade heat to reveal true colors before flash
            heatOverlay.style.transition = 'opacity 1.5s ease-out';
            heatOverlay.style.opacity = '0';
            finished = true;

            // Flash effect
            const flashEl = document.getElementById('print-flash');
            if (flashEl) {
              flashEl.classList.add('active');
              setTimeout(() => flashEl.classList.remove('active'), 500);
            }

            // Transition to list view after flash
            setTimeout(() => {
              const user = auth.currentUser;
              if (user) {
                loadFlights(user.uid).then(flights => {
                  document.getElementById('print-card').style.display = 'none';
                  document.getElementById('flight-card').style.display = '';
                  document.querySelector('#app-screen .view-toggle').style.display = '';
                  document.querySelector('#app-screen .share-pill-btn').style.display = '';
                  renderFlights(flights);
                  loadAirportsData();
                });
              }
            }, 1200);
            return;
          } else {
            // Waiting for next flight — keep sweeping same line
            direction *= -1;
            sweepT = 0;
          }
        }

        const easedT = easeInOut(Math.min(sweepT, 1));
        laserX = direction === 1 ? easedT * W : W - easedT * W;

        const railY = currentY + curLineH / 2;
        const contactY = railY + 22;
        rail.style.top = railY + 'px';
        arm.style.left = (laserX - 7) + 'px';
        arm.style.top = (railY + 1) + 'px';
        head.style.left = (laserX - 2.5) + 'px';
        head.style.top = contactY + 'px';
        sparks.style.left = laserX + 'px';
        sparks.style.top = (contactY + 2) + 'px';

        // Heat overlay — freshly printed area is lighter, cools to true color
        const coolDist = 100;
        const settledY = Math.max(0, currentY - coolDist);
        const btmClip = currentY + curLineH;
        heatOverlay.style.background = 'linear-gradient(180deg, ' +
          'transparent ' + settledY + 'px, ' +
          'rgba(255,255,255,0.4) ' + currentY + 'px, ' +
          'rgba(255,255,255,0.4) 100%)';
        heatOverlay.style.clipPath = surface.style.clipPath;

        // Surface glow at contact point
        const gc = getLaserGlow(currentY, H);
        surfaceGlow.style.left = laserX + 'px';
        surfaceGlow.style.top = contactY + 'px';
        surfaceGlow.style.background = 'radial-gradient(circle, ' +
          'rgba(255,255,255,1) 0%, ' +
          'rgba(255,245,200,0.9) 12%, ' +
          gc + '0.8) 28%, ' +
          gc + '0.55) 45%, ' +
          gc + '0.25) 65%, ' +
          'transparent 100%)';

        const trailY = currentY + curLineH / 2 - 1.5;
        if (direction === 1) {
          trail.style.left = '0';
          trail.style.width = Math.max(0, laserX) + 'px';
          trail.style.background = 'linear-gradient(90deg, transparent, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.3))';
        } else {
          trail.style.left = laserX + 'px';
          trail.style.width = Math.max(0, W - laserX) + 'px';
          trail.style.background = 'linear-gradient(270deg, transparent, rgba(255,255,255,0.08) 40%, rgba(255,255,255,0.3))';
        }
        trail.style.top = trailY + 'px';

        updateClip();
        _printRAF = requestAnimationFrame(tick);
      }

      updateGlow();
      _printRAF = requestAnimationFrame(tick);
    }

    async function loadAirportsData() {
      if (_airportsData) return _airportsData;
      log('MAP', 'Loading airports.json...');
      const resp = await fetch('assets/airports.json');
      _airportsData = await resp.json();
      log('MAP', 'Loaded ' + Object.keys(_airportsData).length + ' airports');
      return _airportsData;
    }

    async function renderMap(flights) {
      const airports = await loadAirportsData();

      const codes = [];
      const routes = [];
      for (const f of flights) {
        if (f.origin && airports[f.origin] && !codes.includes(f.origin)) codes.push(f.origin);
        if (f.airport && airports[f.airport] && !codes.includes(f.airport)) codes.push(f.airport);
        if (f.origin && f.airport && airports[f.origin] && airports[f.airport]) {
          routes.push({ from: f.origin, to: f.airport });
        }
      }

      log('MAP', 'Rendering globe: ' + codes.length + ' airports, ' + routes.length + ' routes');

      // Calculate % world traveled — unique countries visited / 195
      const countries = new Set();
      for (const code of codes) {
        if (airports[code] && airports[code].country) countries.add(airports[code].country);
      }
      const pct = Math.round((countries.size / 195) * 100);
      const tEl = document.getElementById('traveled-text');
      if (tEl) tEl.textContent = pct + '% Traveled';
      log('MAP', 'Countries: ' + countries.size + '/195 = ' + pct + '% (' + [...countries].join(',') + ')');

      renderGlobe('globe-canvas', routes, codes);
    }

    // ============================================
    // 3D Globe (Three.js)
    // ============================================

    let _globeCleanup = null;

    function latLngToVec3(lat, lng, radius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lng + 180) * Math.PI / 180;
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function createGreatCircleArc(lat1, lng1, lat2, lng2, radius, segments) {
      const start = latLngToVec3(lat1, lng1, radius);
      const end = latLngToVec3(lat2, lng2, radius);
      const points = [];

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const point = new THREE.Vector3().lerpVectors(start, end, t).normalize().multiplyScalar(radius * 1.005);
        points.push(point);
      }

      return points;
    }

    function renderGlobe(canvasId, routes, airportCodes) {
      // Clean up previous globe
      if (_globeCleanup) { _globeCleanup(); _globeCleanup = null; }

      const canvas = document.getElementById(canvasId);
      if (!canvas || typeof THREE === 'undefined') {
        log('GLOBE', 'Canvas or Three.js not available');
        return;
      }

      const container = canvas.parentElement;
      const W = container.clientWidth || 372;
      const H = container.clientHeight || 631;
      const RADIUS = Math.min(W, H) * 0.342;

      canvas.width = W * 2;
      canvas.height = H * 2;

      // Scene
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, W / H, 1, 2000);
      camera.position.z = RADIUS * 3.2;

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(window.devicePixelRatio || 2);

      // Gradient sphere texture
      const texCanvas = document.createElement('canvas');
      texCanvas.width = 512;
      texCanvas.height = 512;
      const ctx = texCanvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#FE0605');
      grad.addColorStop(0.089, '#FF8C04');
      grad.addColorStop(0.263, '#FEFB00');
      grad.addColorStop(0.432, '#5AFC01');
      grad.addColorStop(0.585, '#2AEAD5');
      grad.addColorStop(0.769, '#0109FF');
      grad.addColorStop(0.895, '#8C03FF');
      grad.addColorStop(1, '#FA05DE');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(texCanvas);

      // --- Sun position from current time ---
      const now = new Date();
      const utcH = now.getUTCHours() + now.getUTCMinutes() / 60;
      const sunLng = (12 - utcH) * 15;
      const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
      const sunLat = 23.44 * Math.sin((2 * Math.PI / 365) * (dayOfYear - 81));
      const sunDir = latLngToVec3(sunLat, sunLng, 1).normalize();

      // Custom shader: gradient texture + day/night + inner glow
      const sphereGeom = new THREE.SphereGeometry(RADIUS, 64, 64);
      const sphereMat = new THREE.ShaderMaterial({
        uniforms: {
          map: { value: texture },
          sunDir: { value: sunDir },
        },
        vertexShader: [
          'varying vec2 vUv;',
          'varying vec3 vNormal;',
          'varying vec3 vPosition;',
          'void main() {',
          '  vUv = uv;',
          '  vNormal = normalize(normal);',
          '  vPosition = position;',
          '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
          '}',
        ].join('\n'),
        fragmentShader: [
          'uniform sampler2D map;',
          'uniform vec3 sunDir;',
          'varying vec2 vUv;',
          'varying vec3 vNormal;',
          'varying vec3 vPosition;',
          'void main() {',
          '  vec4 texColor = texture2D(map, vUv);',
          '  float sunFace = dot(normalize(vPosition), sunDir);',
          // Smooth transition: -0.1 to 0.1 is the terminator
          '  float dayFactor = smoothstep(-0.15, 0.15, sunFace);',
          // Dark side: 30% brightness. Lit side: 100%
          '  float brightness = mix(0.3, 1.0, dayFactor);',
          // Inner glow on lit side
          '  float glow = pow(max(0.0, sunFace), 3.0) * 0.25;',
          '  vec3 color = texColor.rgb * brightness + vec3(1.0, 0.95, 0.85) * glow;',
          '  gl_FragColor = vec4(color, 1.0);',
          '}',
        ].join('\n'),
      });
      const sphere = new THREE.Mesh(sphereGeom, sphereMat);
      scene.add(sphere);

      // Outer glow — emits the sphere's own gradient colors
      const outerGlowGeom = new THREE.SphereGeometry(RADIUS * 1.8, 64, 64);
      const outerGlowMat = new THREE.ShaderMaterial({
        uniforms: {
          map: { value: texture },
        },
        vertexShader: [
          'varying vec3 vNormal;',
          'varying vec2 vUv;',
          'void main() {',
          '  vNormal = normalize(normalMatrix * normal);',
          '  vUv = uv;',
          '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
          '}',
        ].join('\n'),
        fragmentShader: [
          'uniform sampler2D map;',
          'varying vec3 vNormal;',
          'varying vec2 vUv;',
          'void main() {',
          '  vec4 texColor = texture2D(map, vUv);',
          '  float rim = 1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0)));',
          '  float inner = smoothstep(0.0, 0.1, rim);',
          '  float outer = 1.0 - smoothstep(0.1, 0.55, rim);',
          '  float glow = inner * outer * 1.3;',
          '  gl_FragColor = vec4(texColor.rgb, glow);',
          '}',
        ].join('\n'),
        transparent: true,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const outerGlow = new THREE.Mesh(outerGlowGeom, outerGlowMat);
      sphere.add(outerGlow);

      // Airport dots
      const dotGeom = new THREE.SphereGeometry(RADIUS * 0.025, 12, 12);
      const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

      const airportPositions = {};

      for (const code of airportCodes) {
        let lat, lng;
        if (_airportsData && _airportsData[code]) {
          lat = _airportsData[code].lat;
          lng = _airportsData[code].lng;
        } else {
          // Random position for homepage demo
          lat = (Math.random() - 0.5) * 120;
          lng = (Math.random() - 0.5) * 300;
        }

        const pos = latLngToVec3(lat, lng, RADIUS * 1.01);
        const dot = new THREE.Mesh(dotGeom, dotMat);
        dot.position.copy(pos);
        sphere.add(dot);
        airportPositions[code] = { lat, lng };
      }

      // Airport labels (HTML overlay)
      const labelsContainer = document.getElementById(canvasId === 'globe-canvas' ? 'globe-labels' : 'home-globe-labels');
      if (labelsContainer) labelsContainer.innerHTML = '';
      const labelData = [];

      for (const code of airportCodes) {
        const ap = airportPositions[code];
        if (!ap) continue;
        const pos3d = latLngToVec3(ap.lat, ap.lng, RADIUS * 1.01);

        const label = document.createElement('div');
        label.className = 'globe-label';
        label.innerHTML = '<div class="globe-label-pill">' + code + '</div><div class="globe-label-arrow"></div>';
        if (labelsContainer) labelsContainer.appendChild(label);

        labelData.push({ el: label, pos: pos3d });
      }

      // Route arcs
      let colorIdx = 0;
      for (const route of routes) {
        const from = airportPositions[route.from];
        const to = airportPositions[route.to];
        if (!from || !to) continue;

        const arcPoints = createGreatCircleArc(from.lat, from.lng, to.lat, to.lng, RADIUS, 50);
        const curve = new THREE.CatmullRomCurve3(arcPoints);
        const tubeGeom = new THREE.TubeGeometry(curve, 50, RADIUS * 0.008, 8, false);
        const color = MAP_LINE_COLORS[colorIdx % MAP_LINE_COLORS.length];
        const tubeMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
        const tube = new THREE.Mesh(tubeGeom, tubeMat);
        sphere.add(tube);
        colorIdx++;
      }

      // Drag to rotate
      let isDragging = false;
      let prevX = 0, prevY = 0;
      let rotVelX = 0, rotVelY = 0;

      canvas.addEventListener('mousedown', (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
      canvas.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        rotVelY = dx * 0.005;
        rotVelX = dy * 0.005;
        sphere.rotation.y += rotVelY;
        sphere.rotation.x += rotVelX;
        prevX = e.clientX; prevY = e.clientY;
      });
      canvas.addEventListener('mouseup', () => { isDragging = false; });

      canvas.addEventListener('touchstart', (e) => {
        isDragging = true;
        prevX = e.touches[0].clientX;
        prevY = e.touches[0].clientY;
      }, { passive: true });
      canvas.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const dx = e.touches[0].clientX - prevX;
        const dy = e.touches[0].clientY - prevY;
        rotVelY = dx * 0.005;
        rotVelX = dy * 0.005;
        sphere.rotation.y += rotVelY;
        sphere.rotation.x += rotVelX;
        prevX = e.touches[0].clientX;
        prevY = e.touches[0].clientY;
      }, { passive: true });
      canvas.addEventListener('touchend', () => { isDragging = false; }, { passive: true });

      // Animation loop
      let animId;
      const _projVec = new THREE.Vector3();

      function animate() {
        animId = requestAnimationFrame(animate);

        // Inertia + slow auto-rotate when not dragging
        if (!isDragging) {
          rotVelX *= 0.95;
          rotVelY *= 0.95;
          sphere.rotation.y += rotVelY + 0.002;
          sphere.rotation.x += rotVelX;
        }

        renderer.render(scene, camera);

        // Update label positions
        for (const ld of labelData) {
          // Get world position of the airport (accounting for sphere rotation)
          _projVec.copy(ld.pos);
          sphere.localToWorld(_projVec);

          // Check if facing camera (dot product with camera direction)
          const camDir = new THREE.Vector3(0, 0, 1);
          const toCamera = _projVec.clone().normalize();
          const facing = toCamera.dot(camDir);

          if (facing > 0.15) {
            // Project to 2D
            const projected = _projVec.clone().project(camera);
            const x = (projected.x * 0.5 + 0.5) * W;
            const y = (-projected.y * 0.5 + 0.5) * H;
            ld.el.style.left = x + 'px';
            ld.el.style.top = y + 'px';
            ld.el.style.opacity = Math.min(1, (facing - 0.15) / 0.3);
          } else {
            ld.el.style.opacity = '0';
          }
        }
      }
      animate();

      // Cleanup function
      _globeCleanup = () => {
        cancelAnimationFrame(animId);
        renderer.dispose();
        sphereGeom.dispose();
        sphereMat.dispose();
        texture.dispose();
        dotGeom.dispose();
        dotMat.dispose();
        if (labelsContainer) labelsContainer.innerHTML = '';
      };

      log('GLOBE', 'Rendered ' + airportCodes.length + ' airports, ' + routes.length + ' arcs');
    }

    // ============================================
    // Gradient parallax on scroll
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('flight-card');
      const rows = document.getElementById('flight-rows');
      if (!rows || !card) return;

      // Gradient parallax is now handled by slotUpdateGradient()

      // --- Gyroscope 3D tilt (device only) ---
      const MAX_TILT = 30;

      function initGyro() {
        log('GYRO', 'initGyro called — listening for deviceorientation');
        let baseGamma = null;
        let baseBeta = null;
        let eventCount = 0;

        window.addEventListener('deviceorientation', (e) => {
          eventCount++;
          if (eventCount <= 3) {
            log('GYRO', 'event #' + eventCount + ' gamma=' + e.gamma + ' beta=' + e.beta + ' alpha=' + e.alpha);
          }

          if (e.gamma === null || e.beta === null) {
            if (eventCount <= 3) log('GYRO', 'gamma/beta is null — gyro not available');
            return;
          }

          if (baseGamma === null) {
            baseGamma = e.gamma;
            baseBeta = e.beta;
            log('GYRO', 'Baseline set: gamma=' + baseGamma + ' beta=' + baseBeta);
          }

          const dx = Math.max(-MAX_TILT, Math.min(MAX_TILT, (e.gamma - baseGamma) * 1.5));
          const dy = Math.max(-MAX_TILT, Math.min(MAX_TILT, (e.beta - baseBeta) * -1.5));

          card.style.transform = 'perspective(800px) rotateX(' + dy + 'deg) rotateY(' + dx + 'deg)';
        });
      }

      // Gyro init is triggered from handleSignIn (user gesture required on iOS)
      let _gyroReady = false;
      function tryInitGyro() {
        if (_gyroReady) return;
        if (typeof DeviceOrientationEvent === 'undefined') {
          log('GYRO', 'No DeviceOrientationEvent — not supported');
          return;
        }
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          log('GYRO', 'Requesting iOS permission');
          DeviceOrientationEvent.requestPermission()
            .then(state => {
              log('GYRO', 'Permission: ' + state);
              if (state === 'granted') { _gyroReady = true; initGyro(); }
            })
            .catch(err => {
              log('GYRO', 'Permission error: ' + err + ' — trying direct');
              _gyroReady = true;
              initGyro();
            });
        } else {
          log('GYRO', 'No permission needed — direct init');
          _gyroReady = true;
          initGyro();
        }
      }
    });
  </script>
</body>
</html>
